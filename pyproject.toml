[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent_kernel"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "httpx>=0.25",
    "typing-extensions>=4.12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
